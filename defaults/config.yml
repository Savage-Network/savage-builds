#
# SpartaMC Builds - Configuracao do WorldEdit
# (c) 2026 Sparta Network. - zrfadev
# Servidor de builds do SpartaMC (https://spartamc.com.br)
#
# IMPORTANTE: Use ESPACOS, nao TABS.
#
# === Comandos /bs (Use /sb para ajuda in-game) ===
#
# [BUILD] Construcao:
#   /bs gradient <bloco1> <bloco2> [v|h|d]     - Gradiente entre blocos
#   /bs checkerboard <bloco1> <bloco2> [tam]    - Padrao xadrez
#   /bs stripes <bloco1> <bloco2> [larg] [eixo] - Listras alternadas
#   /bs outline <bloco>                         - Arestas da selecao
#   /bs colorswap <cor_de> <cor_para>           - Trocar paleta de cores
#   /bs palette [wool|clay|glass]               - Paleta de cores
#   /bs measure                                 - Medir selecao
#   /bs clear                                   - Limpar selecao
#   /bs undo [n] / /bs redo [n]                 - Desfazer/refazer
#
# [STAFF] Avancado:
#   /bs randomfill <bloco> <peso> ...           - Preenchimento aleatorio
#   /bs terraform [camadas]                     - Naturalizar terreno
#   /bs heightmap <raise|lower|smooth> [forca]  - Moldar terreno
#   /bs circle <bloco> <raio> [preenchido]      - Circulo horizontal
#   /bs save <nome> / /bs load <nome> / /bs list - Schematics
#
# === Cargos ===
#   spartabuilds.build  - Construtor (comandos basicos)
#   spartabuilds.staff  - Staff (avancados + build)
#   spartabuilds.admin  - Admin (acesso total, padrao: OP)
#

limits:
    allow-extra-data-values: true
    max-blocks-changed:
        default: 50000
        maximum: 200000
    max-polygonal-points:
        default: 50
        maximum: 50
    max-radius: 150
    max-super-pickaxe-size: 10
    max-brush-radius: 15
    butcher-radius:
        default: 200
        maximum: 500
    disallowed-blocks: [7, 46]

use-inventory:
    enable: false
    allow-override: true
    creative-mode-overrides: true

logging:
    log-commands: true
    file: worldedit.log

super-pickaxe:
    drop-items: false
    many-drop-items: false

snapshots:
    directory: snapshots

navigation-wand:
    item: 345
    max-distance: 250

scripting:
    timeout: 10000
    dir: craftscripts

saving:
    dir: schematics

files:
    allow-symbolic-links: false

history:
    size: 50
    expiration: 60

wand-item: 271
shell-save-type:
no-double-slash: false
no-op-permissions: false
debug: false
show-help-on-first-use: true
