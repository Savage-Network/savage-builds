name: Builds
main: com.savagemc.builds.SavageMCBuilds
version: "3.0-SavageMC"
description: Plugin de construcao do SavageMC. WorldEdit + ferramentas de build, permissoes e prefixos.
author: zrfadev
website: https://savagemc.net
# WorldEdit precisa estar em plugins/ (nome no plugin.yml do WE: WorldEdit).
# Usamos softdepend para nao falhar se o nome do fork for outro; sem WorldEdit o plugin nao inicia.
softdepend: [WorldEdit, Spout]

commands:
  bs:
    description: Comando principal do SavageMC Builds
    usage: /bs <subcomando> [args...]
    aliases: [builds, "//"]
  gradient:
    description: Gradiente entre dois blocos
    usage: /gradient <bloco1> <bloco2> [v|h|d]
    aliases: [grad]
    permission: savagebuilds.gradient
  checkerboard:
    description: Padrao xadrez na selecao
    usage: /checkerboard <bloco1> <bloco2> [tamanho]
    aliases: [checker, xadrez]
    permission: savagebuilds.checkerboard
  stripes:
    description: Listras alternadas na selecao
    usage: /stripes <bloco1> <bloco2> [largura] [eixo]
    aliases: [listras]
    permission: savagebuilds.stripes
  outline:
    description: Desenha as arestas da selecao cubica
    usage: /outline <bloco>
    aliases: [contorno, arestas]
    permission: savagebuilds.outline
  colorswap:
    description: Troca paleta de cores em blocos coloridos
    usage: /colorswap <cor_origem 0-15> <cor_destino 0-15>
    aliases: [cswap, trocarcor]
    permission: savagebuilds.colorswap
  measure:
    description: Medir dimensoes da selecao
    usage: /measure
    aliases: [medir]
    permission: savagebuilds.measure
  palette:
    description: Coloca paleta de cores para referencia
    usage: /palette [wool|clay|glass]
    aliases: [paleta]
    permission: savagebuilds.palette
  randomfill:
    description: Preenchimento aleatorio com pesos
    usage: /randomfill <bloco1> <peso1> <bloco2> <peso2> ...
    aliases: [rfill, aleatorio]
    permission: savagebuilds.randomfill
  terraform:
    description: Naturaliza o terreno
    usage: /terraform [camadas_terra]
    aliases: [tf, naturalizar]
    permission: savagebuilds.terraform
  heightmap:
    description: Modifica altura do terreno
    usage: /heightmap <raise|lower|smooth> [intensidade]
    aliases: [hmap, terreno]
    permission: savagebuilds.heightmap
  circle:
    description: Desenha circulo horizontal
    usage: /circle <bloco> <raio> [preenchido]
    aliases: [circulo]
    permission: savagebuilds.circle
  sphere:
    description: Esfera 3D (extra)
    usage: /sphere <bloco> <raio> [preenchido]
    aliases: [esfera]
    permission: savagebuilds.staff
  cylinder:
    description: Cilindro vertical (extra)
    usage: /cylinder <bloco> <raio> <altura> [preenchido]
    aliases: [cilindro, cyl]
    permission: savagebuilds.staff
  walls:
    description: Apenas paredes da selecao (extra)
    usage: /walls <bloco>
    aliases: [paredes]
    permission: savagebuilds.build
  floor:
    description: Apenas chao da selecao (extra)
    usage: /floor <bloco>
    aliases: [chao]
    permission: savagebuilds.build
  replace:
    description: Substituir blocos na selecao (extra)
    usage: /replace <bloco_origem> <bloco_destino>
    aliases: [substituir]
    permission: savagebuilds.build
  tag:
    description: Selecionar ou ver tags disponiveis
    usage: /tag [nome|list|off]
    aliases: [tags]
    permission: savagebuilds.build
  setcargo:
    description: Definir cargo de um jogador (admin=qualquer, staff=builder)
    usage: /setcargo <nick> <admin|staff|builder|none>
    permission: savagebuilds.setcargo
  cargos:
    description: Ver cargo, listar jogadores ou definir cargos
    usage: /cargos [list|info <nick>|set <nick> <cargo>]
    aliases: [meucargo]
    permission: savagebuilds.cargos
  top:
    description: Ver top jogadores por tempo de jogo
    usage: /top [quantidade]
    aliases: [toptime, toptempo]
  topblocos:
    description: Ver top jogadores por blocos colocados
    usage: /topblocos [quantidade]
    aliases: [topblocks, topbloco]
  slap:
    description: Dar um tapao em um jogador (brincadeira)
    usage: /slap <jogador>
    permission: savagebuilds.fun
  rocket:
    description: Lancar jogador como foguete
    usage: /rocket [jogador]
    permission: savagebuilds.fun
  hat:
    description: Colocar item da mao na cabeca
    usage: /hat
    permission: savagebuilds.fun
  hug:
    description: Abracar um jogador
    usage: /hug <jogador>
    permission: savagebuilds.fun
  kiss:
    description: Beijar um jogador
    usage: /kiss <jogador>
    permission: savagebuilds.fun
  confetti:
    description: Jogar confete (particulas)
    usage: /confetti
    permission: savagebuilds.fun
  flip:
    description: Dar um flip/pirueta
    usage: /flip
    permission: savagebuilds.fun
  sb:
    description: Lista todos os comandos e cargos do SavageMC Builds
    usage: /sb
    aliases: [savagebuilds, savageb]
  sbreload:
    description: Recarrega a configuracao do plugin (admin)
    usage: /sbreload
    permission: savagebuilds.admin
  sudo:
    description: Forca um jogador a executar um comando (como se ele tivesse digitado)
    usage: /sudo <jogador> <comando>
    permission: savagebuilds.sudo
  pyramid:
    description: Desenha piramide 3D
    usage: /pyramid <bloco> <tamanho> [preenchido]
    aliases: [piramide]
    permission: savagebuilds.staff
  ellipsoid:
    description: Desenha elipsoide 3D
    usage: /ellipsoid <bloco> <rx> <ry> <rz> [preenchido]
    aliases: [elipsoide]
    permission: savagebuilds.staff

# =============================================
# SISTEMA DE PERMISSOES
# =============================================
#
# Hierarquia: admin > staff > build
#
# savagebuilds.build  -> Construtor (ferramentas basicas)
# savagebuilds.staff  -> Staff (avancados + tudo do build)
# savagebuilds.admin  -> Admin (acesso total, padrao: OP)
#
# Prefixos automaticos no chat:
#   ADMIN  = &4&lADMIN &4
#   STAFF  = &9&lSTAFF &9
#   BUILDER = &2&lBUILDER &2

permissions:
  savagebuilds.build:
    description: Cargo Build - ferramentas essenciais de construcao
    default: false
    children:
      savagebuilds.cargos: true
      savagebuilds.gradient: true
      savagebuilds.checkerboard: true
      savagebuilds.stripes: true
      savagebuilds.outline: true
      savagebuilds.colorswap: true
      savagebuilds.measure: true
