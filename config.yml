# ========== PLUGIN - ACESSO ==========
# open-to-all: true = servidor aberto para todos (ignora cargo/bypass)
# open-to-all: false = apenas jogadores com cargo ou bypass podem entrar
open-to-all: false

# ========== PLUGIN - BYPASS ==========
bypass:
  enabled: true
  permission: "spartabuilds.bypass"
  op-bypass: true

# ========== PLUGIN - MUNDOS ==========
allowed-worlds: []

# ========== PLUGIN - BANCO DE DADOS (MySQL) ==========
database:
  enabled: true
  host: 'mysql52-farm1.kinghost.net'
  port: 3306
  username: 'zrfa0101_add2'
  password: 'Sparta67DB'
  database: 'zrfa01'
  use-ssl: false

# ========== PLUGIN - SCOREBOARD ==========
scoreboard:
  enabled: true
  title: "&6&lSPARTA"
  footer: "&6spartamc.com.br"
  update-interval: 10

# ========== WORLDEDIT - LIMITES ==========
limits:
  allow-extra-data-values: true
  max-blocks-changed:
    default: 50000
    maximum: 200000
  max-polygonal-points:
    default: 50
    maximum: 50
  max-radius: 150
  max-super-pickaxe-size: 10
  max-brush-radius: 15
  butcher-radius:
    default: 200
    maximum: 500
  disallowed-blocks: [7, 46]

# ========== WORLDEDIT - OUTRAS OPCOES ==========
use-inventory:
  enable: false
  allow-override: true
  creative-mode-overrides: true

logging:
  log-commands: true
  file: worldedit.log

super-pickaxe:
  drop-items: false
  many-drop-items: false

snapshots:
  directory: snapshots

navigation-wand:
  item: 345
  max-distance: 250

scripting:
  timeout: 10000
  dir: craftscripts

saving:
  dir: schematics

files:
  allow-symbolic-links: false

history:
  size: 50
  expiration: 60

wand-item: 271
shell-save-type:
no-double-slash: false
no-op-permissions: false
debug: false
show-help-on-first-use: true
